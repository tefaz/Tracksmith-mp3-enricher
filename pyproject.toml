[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracksmith"
version = "0.2.0"
description = "Local MP3 metadata and edited-audio lyric synchronization"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "mutagen>=1.47,<2", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]
ai = ["openai-whisper>=20250625", "transformers>=4.45,<5", "torch>=2.5", "soundfile>=0.12"]
separation = ["demucs>=4.0.1", "soundfile>=0.12"]

[project.scripts]
tracksmith = "tracksmith.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracksmith = ["assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
